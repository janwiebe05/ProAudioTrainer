[package]
name = "paw-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable DSP + exercise/scoring core for ProAudioTrainer (desktop, later iOS)"

[dependencies]
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "ogg", "vorbis", "aac", "isomp4"] }
rustfft = "6"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
hound = "3"

[dev-dependencies]
approx = "0.5"
rand_chacha = "0.3"

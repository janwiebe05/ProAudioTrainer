# Builds the real Windows/macOS/Linux desktop installers on GitHub's own
# runners. This exists because the Tauri rewrite (see /root/.claude/plans or
# the git history around "feat: Tauri shell + EQ trainer wired end-to-end")
# was developed in a Linux-only container that cannot produce a signed
# Windows .exe or a macOS .app/.dmg itself — cargo-tauri needs to actually
# run on each target OS. This workflow is the practical way to get real
# artifacts for both without owning that hardware.
#
# Manual run: Actions tab → "Build Desktop App" → Run workflow.
# Tag run: push a tag like `v0.1.0` to also attach the artifacts to a
# GitHub Release.
name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

# The default GITHUB_TOKEN is read-only unless a repo's default workflow
# permissions are set to read+write — tauri-action needs contents:write to
# create the draft release and upload installer/updater assets to it.
# Declaring it here explicitly means this doesn't depend on that repo-wide
# setting (Settings → Actions → General → Workflow permissions).
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libayatana-appindicator3-dev build-essential

      # No frontend build step: frontend/ is plain HTML/CSS/JS served
      # directly (see src-tauri/tauri.conf.json build.frontendDist).
      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows code signing (optional — set these repo secrets once you
          # have an Authenticode certificate; unsigned builds still work,
          # they just trigger a SmartScreen warning on first run).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing + notarization (optional — needs a paid Apple
          # Developer account; see docs/PACKAGING.md). Without these, the
          # macOS build still produces a .app/.dmg, just Gatekeeper-blocked
          # until the user right-click-opens it once.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "ProAudioTrainer ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload build artifacts (manual runs / non-tag builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: proaudiotrainer-${{ matrix.platform }}
          path: |
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/rpm/*.rpm
          if-no-files-found: ignore

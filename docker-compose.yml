version: '3.8'

services:
  backend:
    build: ./backend
    container_name: proaudio-backend
    environment:
      PORT: 3001
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-proaudio-secret-change-in-prod}
    ports:
      - "3001:3001"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/src/data:/app/src/data
    networks:
      - proaudio-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: proaudio-frontend
    ports:
      - "8090:80"
    depends_on:
      - backend
    networks:
      - proaudio-net
      - nginx-proxy-manager_default
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  proaudio-net:
    driver: bridge
  nginx-proxy-manager_default:
    external: true
